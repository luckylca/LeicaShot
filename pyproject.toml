[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laika-image-engine"
version = "0.1.0"
description = "A memory-first cross-platform AI image processing engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.3",
  "psutil>=5.9",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]
inference = [
  "onnxruntime>=1.18",
  "numpy>=1.26",
  "opencv-python-headless==5.0.0.93",
]
dev = [
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless==5.0.0.93",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
laika = "laika.cli:main"
laika-api = "laika.api:run"
laika-bench = "laika.benchmark:main"
laika-models = "laika.model_assets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laika = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
