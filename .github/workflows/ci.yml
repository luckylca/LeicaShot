name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  web:
    name: React editor · Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web editor
        working-directory: web
        run: npm test
      - name: Build web editor
        working-directory: web
        run: npm run build

  quality:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,dev]"
      - name: Build a wheel
        run: python -m pip wheel --no-deps . --wheel-dir build/wheels
      - name: Check formatting
        run: python -m ruff format --check src tests scripts
      - name: Run static checks
        run: python -m ruff check src tests scripts
      - name: Run tests
        run: python -m pytest -q

  containers:
    name: Docker API and Web · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build API and Web images
        run: docker compose build --pull
      - name: Start services without model assets
        run: docker compose up -d
      - name: Check API, Web and reverse proxy
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health \
              --output /tmp/laika-api-health.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; assert json.load(open('/tmp/laika-api-health.json'))['status'] == 'ok'"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/health \
            --output /tmp/laika-web-proxy-health.json
          python -c "import json; assert json.load(open('/tmp/laika-web-proxy-health.json'))['status'] == 'ok'"
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"'
      - name: Stop and remove deployment data
        if: always()
        run: docker compose down --volumes
