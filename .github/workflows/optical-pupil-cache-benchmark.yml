name: Optical pupil cache CPU microbenchmark

on:
  pull_request:
    paths:
      - "src/laika/highlights.py"
      - "scripts/benchmark_optical_pupil_cache.py"
      - ".github/workflows/optical-pupil-cache-benchmark.yml"

jobs:
  optical-pupil-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Measure uncached vs bounded-cache optical scatter
        run: python scripts/benchmark_optical_pupil_cache.py --repeat 2
